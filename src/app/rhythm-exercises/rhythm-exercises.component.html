<div class="rhythm-container">
  <div class="bg-pattern"></div>
  <div class="container">
    <ng-container *ngIf="!selectedExercise">
      <button class="btn-back" (click)="goBack()">← Voltar</button>
      <h2>Exercicio ritmico</h2>
      <p class="subtitle">Escolha um exercicio para praticar</p>

      <div class="exercise-list">
        <button
          class="exercise-card"
          *ngFor="let exercise of exercises"
          (click)="openExercise(exercise)"
        >
          <span class="exercise-number">{{ exercise.id }}</span>
          <span class="exercise-title">{{ exercise.title }}</span>
          <span class="exercise-arrow">›</span>
        </button>
      </div>
    </ng-container>

    <ng-container *ngIf="selectedExercise">
      <button class="btn-back" (click)="closeExercise()">
        ← Voltar aos exercicios
      </button>
      <h2>{{ selectedExercise.title }}</h2>

      <section class="rhythm-card">
        <h3>Partitura</h3>
        <img
          class="rhythm-image"
          [src]="selectedExercise.imageSrc"
          [alt]="'Partitura do ' + selectedExercise.title"
        />
      </section>

      <section class="rhythm-card">
        <h3>Audio</h3>
        <audio
          #referenceAudio
          class="rhythm-audio"
          [src]="selectedExercise.audioSrc"
          controls
        ></audio>
      </section>

      <section class="rhythm-card">
        <h3>Sua gravacao</h3>

        <div class="action-row">
          <button
            class="action-btn"
            type="button"
            (click)="startRecording()"
            [disabled]="isRecording || isAnalyzing"
          >
            Gravar tentativa
          </button>

          <button
            class="action-btn stop"
            type="button"
            *ngIf="isRecording"
            (click)="stopRecording()"
          >
            Parar gravacao
          </button>
        </div>

        <p class="status-info" *ngIf="isAnalyzing">
          Comparando com o audio de referencia...
        </p>

        <audio
          *ngIf="recordedAudioUrl"
          class="rhythm-audio"
          [src]="recordedAudioUrl"
          controls
        ></audio>

        <p
          class="status-info"
          *ngIf="comparisonMessage"
          [class.ok]="comparisonDone && canProceed"
          [class.warn]="comparisonDone && !canProceed"
        >
          {{ comparisonMessage }}
        </p>

        <button
          class="next-btn"
          type="button"
          *ngIf="canProceed"
          (click)="openNextExercise()"
        >
          Proximo
        </button>
      </section>
    </ng-container>
  </div>
</div>
